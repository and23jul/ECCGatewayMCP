# Create the service instances once, before the first push:
#   cf create-service xsuaa application XSUAA-application-ECCGatewayMCP -c xs-security.json
#   cf create-service connectivity lite CONN-lite-ECCGatewayMCP   # Gateway-x96-SSO is OnPremise via Cloud Connector
# DEST-lite-Restricted already exists and is reused. It must be in the target space (or shared into it)
# and must contain the Gateway-x96-SSO destination.
# Then: cf push
applications:
  - name: ecc-gateway-mcp
    memory: 256M
    instances: 1
    buildpacks:
      - python_buildpack
    command: python -m ecc_gateway_mcp
    health-check-type: port
    services:
      - XSUAA-application-ECCGatewayMCP
      - DEST-lite-Restricted
      - CONN-lite-ECCGatewayMCP
    env:
      DESTINATION_NAME: Gateway-x96-SSO
      # Read-only ECC Gateway OData V2 services (see metadata/*.edmx.xml). Defaults below match them.
      SALES_SERVICE_PATH: /sap/opu/odata/sap/ZGW_ECCMCP_SALES_SRV
      SALES_HEAD_ENTITY_SET: SOHeadSet
      SALES_ITEM_ENTITY_SET: SOItemSet
      PURCHASING_SERVICE_PATH: /sap/opu/odata/sap/ZGW_ECCMCP_PURCHASING_SRV
      PURCHASING_HEAD_ENTITY_SET: POHeadSet
      PURCHASING_ITEM_ENTITY_SET: POItemSet
      # These sets are pageable=false; the server reads up to this many rows before filtering/paging in memory.
      MAX_BACKEND_ROWS: "5000"
